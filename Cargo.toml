[package]
name = "laya-candle"
version = "0.1.0"
edition = "2021"
description = "English Laya decision-model inference with Candle"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
